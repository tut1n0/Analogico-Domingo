{% extends "base.html" %}

{% block title %}Iniciar sesión | Analógico Domingo{% endblock %}

{% block meta_description %}Inicio de sesión para gestionar el archivo de Analógico Domingo.{% endblock %}

{% block contenido %}

<div class="login-container">

    <h2>Iniciar sesión</h2>

    <form
        action="/login?csrf_token={{ csrf_token }}"
        method="post"
        class="login-form">

        <label for="usuario">Usuario</label>

        <input
            id="usuario"
            type="text"
            name="usuario"
            autocomplete="username"
            required
            autofocus>

        <label for="password">Contraseña</label>

        <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            required>

        <button
            type="submit"
            class="boton">

            Ingresar

        </button>

    </form>

</div>

{% endblock %}
