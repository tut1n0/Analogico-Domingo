{% extends "base.html" %}

{% block contenido %}

<h2>Editar Video</h2>

<div id="upload-status" class="upload-status" role="status"></div>
<div id="upload-error" class="upload-error" role="alert"></div>
<div class="upload-progreso" id="upload-progreso">
    <div class="upload-progreso-fill"></div>
</div>

<form
    action="/videos/editar/{{ video.id_video }}"
    method="post"
    enctype="multipart/form-data"
    class="formulario"
    id="form-video">

    <label>Título</label>

    <input
        type="text"
        name="titulo"
        value="{{ video.titulo }}"
        required>

    <label>Fecha</label>

    <input
        type="date"
        name="fecha"
        value="{{ video.fecha }}">

    <label>Archivo (audio o video)</label>

    {% if video.archivo_url %}
        {% if video.tipo_archivo == "video" %}
        <video controls style="max-width:100%; border-radius:8px; margin-bottom:10px;">
            <source src="{{ video.archivo_url }}">
        </video>
        {% else %}
        <audio controls style="width:100%; margin-bottom:10px;">
            <source src="{{ video.archivo_url }}">
        </audio>
        {% endif %}
        <p style="color:rgba(255,255,255,0.6); font-size:14px; margin-bottom:8px;">Archivo actual. Subí uno nuevo para reemplazarlo.</p>
    {% endif %}

    <input
        type="file"
        name="archivo"
        accept="audio/*,video/*"
        id="input-archivo">

    <input type="hidden" name="archivo_url" id="archivo_url" value="">

    <button
        type="submit"
        class="boton"
        id="btn-submit">

        Guardar Cambios

    </button>

    <a href="/videos/" class="boton" style="text-align:center;">Cancelar</a>

</form>

<script>
document.getElementById("form-video").addEventListener("submit", async function(e) {
    var fileInput = document.getElementById("input-archivo");
    var archivoUrl = document.getElementById("archivo_url").value;
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var progreso = document.getElementById("upload-progreso");
    var fill = progreso.querySelector(".upload-progreso-fill");
    var btn = document.getElementById("btn-submit");

    if (!fileInput.files.length || archivoUrl) return;

    e.preventDefault();
    error.style.display = "none";
    status.textContent = "Subiendo archivo…";
    progreso.classList.add("visible");
    btn.disabled = true;

    try {
        var sig = await rpObtenerFirma("/videos/upload-url?folder=videos");
        var url = await rpSubirCloudinary(sig, fileInput.files[0], function(pct) {
            fill.style.width = pct + "%";
            status.textContent = "Subiendo archivo… " + Math.round(pct) + "%";
        });
        document.getElementById("archivo_url").value = url;
        fill.style.width = "100%";
        status.textContent = "Archivo subido. Guardando cambios…";
        fileInput.value = "";
        this.submit();
    } catch (err) {
        progreso.classList.remove("visible");
        fill.style.width = "0%";
        error.style.display = "block";
        error.textContent = "Error al subir archivo: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
