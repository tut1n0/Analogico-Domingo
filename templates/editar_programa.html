{% extends "base.html" %}

{% block contenido %}

<h2>Editar Programa</h2>

<div id="upload-status" style="display:none; color:blue; margin:10px 0;"></div>
<div id="upload-error" style="display:none; color:red; margin:10px 0;"></div>

<form
    action="/programas/editar/{{ programa.id_programa }}"
    method="post"
    enctype="multipart/form-data"
    class="formulario"
    id="form-programa">

    <label>Número</label>

    <input
        type="number"
        name="numero"
        value="{{ programa.numero }}"
        required>

    <label>Fecha</label>

    <input
        type="date"
        name="fecha"
        value="{{ programa.fecha }}"
        required>

    <label>Observaciones</label>

    <textarea
        name="observaciones"
        rows="6">{{ programa.observaciones }}</textarea>

    <label>Audio del programa</label>

    <input
        type="file"
        name="audio"
        accept=".mp3"
        id="input-audio">

    <input type="hidden" name="audio_url" id="audio_url" value="">

    {% if programa.audio %}

    <p>Audio actual:</p>

        <audio controls preload="none">

            <source
                src="{{ programa.audio }}"
                type="audio/mpeg">

        </audio>

    {% endif %}

    <label>Discos del programa</label>
    <div class="lista-discos">
    {% for disco in discos %}

        <label>

            <input
                type="checkbox"
                name="discos"
                value="{{ disco.id_disco }}"
                {% if disco.id_disco in seleccionados %}checked{% endif %}>

            {{ disco.artista }} - {{ disco.titulo }}

        </label>

    {% endfor %}
    </div>

    <br>

    <button
        type="submit"
        class="boton"
        id="btn-submit">

        Guardar Cambios

    </button>

</form>

<script>
document.getElementById("form-programa").addEventListener("submit", async function(e) {
    var fileInput = document.getElementById("input-audio");
    var audioUrl = document.getElementById("audio_url").value;
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var btn = document.getElementById("btn-submit");

    if (!fileInput.files.length || audioUrl) return;

    e.preventDefault();
    error.style.display = "none";
    status.style.display = "block";
    status.textContent = "Subiendo audio...";
    btn.disabled = true;

    try {
        var sigRes = await fetch("/programas/upload-url?folder=programas");
        if (!sigRes.ok) throw new Error("Error obteniendo firma");
        var sig = await sigRes.json();

        var fd = new FormData();
        fd.append("file", fileInput.files[0]);
        fd.append("api_key", sig.api_key);
        fd.append("timestamp", sig.timestamp);
        fd.append("signature", sig.signature);
        fd.append("folder", sig.folder);
        fd.append("resource_type", "video");

        var res = await fetch(sig.upload_url, { method: "POST", body: fd });
        var data = await res.json();
        if (data.error) throw new Error(data.error.message);

        document.getElementById("audio_url").value = data.secure_url;
        status.textContent = "Audio subido. Guardando programa...";
        fileInput.value = "";
        this.submit();
    } catch (err) {
        status.style.display = "none";
        error.style.display = "block";
        error.textContent = "Error al subir audio: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
