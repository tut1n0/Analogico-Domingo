{% extends "base.html" %}

{% block contenido %}

<h2>Editar Programa</h2>

<div id="upload-status" class="upload-status" role="status"></div>
<div id="upload-error" class="upload-error" role="alert"></div>
<div class="upload-progreso" id="upload-progreso">
    <div class="upload-progreso-fill"></div>
</div>

<form
    action="/programas/editar/{{ programa.id_programa }}"
    method="post"
    enctype="multipart/form-data"
    class="formulario"
    id="form-programa">

    <label>Número</label>

    <input
        type="number"
        name="numero"
        value="{{ programa.numero }}"
        required>

    <label>Fecha</label>

    <input
        type="date"
        name="fecha"
        value="{{ programa.fecha }}"
        required>

    <label>Observaciones</label>

    <textarea
        name="observaciones"
        rows="6">{{ programa.observaciones }}</textarea>

    <label>Audio del programa</label>

    <input
        type="file"
        name="audio"
        accept="audio/*"
        id="input-audio">

    <input type="hidden" name="audio_url" id="audio_url" value="">

    {% if programa.audio %}

    <p>Audio actual:</p>

        <audio controls preload="none">

            <source
                src="{{ programa.audio }}"
                type="audio/mpeg">

        </audio>

    {% endif %}

    <label>Discos del programa</label>
    <div class="lista-discos">
    {% for disco in discos %}

        <label>

            <input
                type="checkbox"
                name="discos"
                value="{{ disco.id_disco }}"
                {% if disco.id_disco in seleccionados %}checked{% endif %}>

            {{ disco.artista }} - {{ disco.titulo }}

        </label>

    {% endfor %}
    </div>

    <br>

    <button
        type="submit"
        class="boton"
        id="btn-submit">

        Guardar Cambios

    </button>

</form>

<script>
document.getElementById("form-programa").addEventListener("submit", async function(e) {
    var fileInput = document.getElementById("input-audio");
    var audioUrl = document.getElementById("audio_url").value;
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var progreso = document.getElementById("upload-progreso");
    var fill = progreso.querySelector(".upload-progreso-fill");
    var btn = document.getElementById("btn-submit");

    if (!fileInput.files.length || audioUrl) return;

    e.preventDefault();
    error.style.display = "none";
    status.textContent = "Subiendo audio…";
    progreso.classList.add("visible");
    btn.disabled = true;

    try {
        var sig = await rpObtenerFirma("/programas/upload-url?folder=programas");
        var url = await rpSubirCloudinary(sig, fileInput.files[0], function(pct) {
            fill.style.width = pct + "%";
            status.textContent = "Subiendo audio… " + Math.round(pct) + "%";
        });
        document.getElementById("audio_url").value = url;
        fill.style.width = "100%";
        status.textContent = "Audio subido. Guardando programa…";
        fileInput.value = "";
        this.submit();
    } catch (err) {
        progreso.classList.remove("visible");
        fill.style.width = "0%";
        error.style.display = "block";
        error.textContent = "Error al subir audio: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
