{% if total_paginas > 1 %}
<div class="paginacion">
    <span class="paginacion-info">Página {{ pagina }} de {{ total_paginas }} ({{ total }} en total)</span>
    <div class="paginacion-botones">
        {% if pagina > 1 %}
        <a class="boton" href="{{ request.url.path }}?page={{ pagina - 1 }}">← Anterior</a>
        {% endif %}
        {% if pagina < total_paginas %}
        <a class="boton" href="{{ request.url.path }}?page={{ pagina + 1 }}">Siguiente →</a>
        {% endif %}
    </div>
</div>
{% endif %}
