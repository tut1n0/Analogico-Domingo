{% extends "base.html" %}

{% block contenido %}

<h2>Nuevo Programa</h2>

<div id="upload-status" style="display:none; color:blue; margin:10px 0;"></div>
<div id="upload-error" style="display:none; color:red; margin:10px 0;"></div>

<form
    action="/programas/nuevo"
    method="post"
    enctype="multipart/form-data"
    class="formulario"
    id="form-programa">

    <label>Número</label>

    <input
        type="number"
        name="numero"
        required>

    <label>Fecha</label>

    <input
        type="date"
        name="fecha"
        required>

    <label>Observaciones</label>

    <textarea
        name="observaciones"
        rows="6"></textarea>

    <label>Audio del programa (MP3)</label>

    <input
        type="file"
        name="audio"
        accept=".mp3"
        id="input-audio">

    <input type="hidden" name="audio_url" id="audio_url" value="">

    <h3>Discos del programa</h3>

    {% if discos %}

        {% for disco in discos %}

        <div class="checkbox-disco">

            <label>

                <input
                    type="checkbox"
                    name="discos"
                    value="{{ disco.id_disco }}">

                <strong>{{ disco.artista }}</strong>
                -
                {{ disco.titulo }}

                {% if disco.anio %}
                    ({{ disco.anio }})
                {% endif %}

            </label>

        </div>

        {% endfor %}

    {% else %}

        <p>No hay discos pendientes.</p>

    {% endif %}

    <button
        type="submit"
        class="boton"
        id="btn-submit">

        Guardar

    </button>

</form>

<script>
document.getElementById("form-programa").addEventListener("submit", async function(e) {
    var fileInput = document.getElementById("input-audio");
    var audioUrl = document.getElementById("audio_url").value;
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var btn = document.getElementById("btn-submit");

    if (!fileInput.files.length || audioUrl) return;

    e.preventDefault();
    error.style.display = "none";
    status.style.display = "block";
    status.textContent = "Obteniendo firma de subida...";
    btn.disabled = true;

    try {
        var sigRes = await fetch("/programas/upload-url?folder=programas&resource_type=video");
        if (!sigRes.ok) throw new Error("No se pudo obtener firma de subida (HTTP " + sigRes.status + ")");
        var sig = await sigRes.json();

        status.textContent = "Subiendo audio a Cloudinary...";
        var fd = new FormData();
        fd.append("file", fileInput.files[0]);
        fd.append("api_key", sig.api_key);
        fd.append("timestamp", sig.timestamp);
        fd.append("signature", sig.signature);
        fd.append("folder", sig.folder);
        fd.append("resource_type", "video");

        var uploadRes = await fetch(sig.upload_url, { method: "POST", body: fd });
        var uploadData = await uploadRes.json();

        if (uploadData.error) throw new Error(uploadData.error.message);

        document.getElementById("audio_url").value = uploadData.secure_url;
        status.textContent = "Audio subido. Guardando programa...";
        fileInput.value = "";
        this.submit();
    } catch (err) {
        status.style.display = "none";
        error.style.display = "block";
        error.textContent = "Error al subir audio: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
