{% extends "base.html" %}

{% block contenido %}

<h2>Nuevo Música</h2>

<div id="upload-status" style="display:none; color:blue; margin:10px 0;"></div>
<div id="upload-error" style="display:none; color:red; margin:10px 0;"></div>

<form
    action="/musica/nuevo"
    method="post"
    class="formulario"
    id="form-musica">

    <label>Título</label>
    <input type="text" name="titulo" required>

    <label>Artista</label>
    <input type="text" name="artista" required>

    <label>Año</label>
    <input type="text" name="anio">

    <label>Descripción</label>
    <textarea name="descripcion" rows="6"></textarea>

    <label>Portada (imagen)</label>
    <input type="file" accept="image/*" id="input-portada">
    <input type="hidden" name="portada_url" id="portada_url" value="">

    <label>Audio (MP3)</label>
    <input type="file" accept=".mp3,audio/*" id="input-audio">
    <input type="hidden" name="audio_url" id="audio_url" value="">

    <button type="submit" class="boton" id="btn-submit">Guardar</button>

</form>

<script>
async function uploadLocal(file, folder, statusEl) {
    statusEl.textContent = "Subiendo archivo...";
    var fd = new FormData();
    fd.append("file", file);
    var res = await fetch("/musica/upload-local?folder=" + folder, { method: "POST", body: fd });
    var data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "Error al subir");
    return data.url;
}

document.getElementById("form-musica").addEventListener("submit", async function(e) {
    var portadaInput = document.getElementById("input-portada");
    var audioInput = document.getElementById("input-audio");
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var btn = document.getElementById("btn-submit");

    var hasPortada = portadaInput.files.length && !document.getElementById("portada_url").value;
    var hasAudio = audioInput.files.length && !document.getElementById("audio_url").value;

    if (!hasPortada && !hasAudio) return;

    e.preventDefault();
    error.style.display = "none";
    status.style.display = "block";
    btn.disabled = true;

    try {
        if (hasPortada) {
            var url = await uploadLocal(portadaInput.files[0], "musica", status);
            document.getElementById("portada_url").value = url;
        }

        if (hasAudio) {
            status.textContent = "Subiendo audio (puede tardar)...";
            var url = await uploadLocal(audioInput.files[0], "musica", status);
            document.getElementById("audio_url").value = url;
        }

        status.textContent = "Archivos subidos. Guardando...";
        this.submit();
    } catch (err) {
        console.error("[UPLOAD ERROR]", err);
        status.style.display = "none";
        error.style.display = "block";
        error.textContent = "Error al subir: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
