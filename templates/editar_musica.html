{% extends "base.html" %}

{% block contenido %}

<h2>Editar Música</h2>

<div id="upload-status" style="display:none; color:blue; margin:10px 0;"></div>
<div id="upload-error" style="display:none; color:red; margin:10px 0;"></div>

<form
    action="/musica/editar/{{ musica.id_musica }}"
    method="post"
    enctype="multipart/form-data"
    class="formulario"
    id="form-musica">

    <label>Título</label>
    <input type="text" name="titulo" value="{{ musica.titulo }}" required>

    <label>Artista</label>
    <input type="text" name="artista" value="{{ musica.artista }}" required>

    <label>Año</label>
    <input type="text" name="anio" value="{{ musica.anio }}">

    <label>Descripción</label>
    <textarea name="descripcion" rows="6">{{ musica.descripcion }}</textarea>

    <label>Portada actual</label>
    {% if musica.portada %}
    <p><img src="{{ musica.portada }}" style="max-height:200px; border-radius:6px;"></p>
    {% endif %}

    <label>Nueva portada (opcional)</label>
    <input type="file" name="portada" accept="image/*" id="input-portada">
    <input type="hidden" name="portada_url" id="portada_url" value="">

    <label>Audio actual</label>
    {% if musica.audio %}
    <audio controls preload="none">
        <source src="{{ musica.audio }}" type="audio/mpeg">
    </audio>
    {% endif %}

    <label>Nuevo audio (opcional)</label>
    <input type="file" name="audio" accept=".mp3" id="input-audio">

    <button type="submit" class="boton" id="btn-submit">Guardar Cambios</button>

</form>

<script>
document.getElementById("form-musica").addEventListener("submit", async function(e) {
    var portadaInput = document.getElementById("input-portada");
    var portadaUrl = document.getElementById("portada_url").value;
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var btn = document.getElementById("btn-submit");

    if (!portadaInput.files.length || portadaUrl) return;

    e.preventDefault();
    error.style.display = "none";
    status.style.display = "block";
    btn.disabled = true;

    try {
        status.textContent = "Subiendo portada...";
        var sigRes = await fetch("/musica/upload-url?folder=musica");
        var sig = await sigRes.json();
        var fd = new FormData();
        fd.append("file", portadaInput.files[0]);
        fd.append("api_key", sig.api_key);
        fd.append("timestamp", sig.timestamp);
        fd.append("signature", sig.signature);
        fd.append("folder", sig.folder);
        fd.append("resource_type", "image");
        var uploadRes = await fetch(sig.upload_url, { method: "POST", body: fd });
        var uploadData = await uploadRes.json();
        if (uploadData.error) throw new Error(uploadData.error.message);
        document.getElementById("portada_url").value = uploadData.secure_url;

        status.textContent = "Portada subida. Guardando...";
        this.submit();
    } catch (err) {
        status.style.display = "none";
        error.style.display = "block";
        error.textContent = "Error: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
