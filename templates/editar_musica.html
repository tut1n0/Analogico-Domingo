{% extends "base.html" %}

{% block contenido %}

<h2>Editar Música</h2>

<div id="upload-status" style="display:none; color:blue; margin:10px 0;"></div>
<div id="upload-error" style="display:none; color:red; margin:10px 0;"></div>

<form
    action="/musica/editar/{{ musica.id_musica }}"
    method="post"
    class="formulario"
    id="form-musica">

    <label>Título</label>
    <input type="text" name="titulo" value="{{ musica.titulo }}" required>

    <label>Artista</label>
    <input type="text" name="artista" value="{{ musica.artista }}" required>

    <label>Año</label>
    <input type="text" name="anio" value="{{ musica.anio }}">

    <label>Descripción</label>
    <textarea name="descripcion" rows="6">{{ musica.descripcion }}</textarea>

    <label>Portada actual</label>
    {% if musica.portada %}
    <p><img src="{{ musica.portada }}" style="max-height:200px; border-radius:6px;"></p>
    {% endif %}

    <label>Nueva portada (opcional)</label>
    <input type="file" accept="image/*" id="input-portada">
    <input type="hidden" name="portada_url" id="portada_url" value="">

    <label>Audio actual</label>
    {% if musica.audio %}
    <audio controls preload="none">
        <source src="{{ musica.audio }}" type="audio/mpeg">
    </audio>
    {% endif %}

    <label>Nuevo audio (opcional)</label>
    <input type="file" accept=".mp3,audio/*" id="input-audio">
    <input type="hidden" name="audio_url" id="audio_url" value="">

    <button type="submit" class="boton" id="btn-submit">Guardar Cambios</button>

</form>

<script>
async function uploadToCloudinary(file, folder, resourceType, statusEl) {
    var sigRes = await fetch("/musica/upload-url?folder=" + folder);
    if (!sigRes.ok) throw new Error("Error obteniendo firma de subida");
    var sig = await sigRes.json();

    statusEl.textContent = "Subiendo " + (resourceType === "image" ? "portada" : "audio") + "...";

    var fd = new FormData();
    fd.append("file", file);
    fd.append("api_key", sig.api_key);
    fd.append("timestamp", sig.timestamp);
    fd.append("signature", sig.signature);
    fd.append("folder", sig.folder);
    fd.append("resource_type", resourceType);

    var uploadRes = await fetch(sig.upload_url, { method: "POST", body: fd });
    var data = await uploadRes.json();

    if (data.error) throw new Error(data.error.message);
    return data.secure_url;
}

document.getElementById("form-musica").addEventListener("submit", async function(e) {
    var portadaInput = document.getElementById("input-portada");
    var audioInput = document.getElementById("input-audio");
    var status = document.getElementById("upload-status");
    var error = document.getElementById("upload-error");
    var btn = document.getElementById("btn-submit");

    var hasPortada = portadaInput.files.length && !document.getElementById("portada_url").value;
    var hasAudio = audioInput.files.length && !document.getElementById("audio_url").value;

    if (!hasPortada && !hasAudio) return;

    e.preventDefault();
    error.style.display = "none";
    status.style.display = "block";
    btn.disabled = true;

    try {
        if (hasPortada) {
            var url = await uploadToCloudinary(portadaInput.files[0], "musica", "image", status);
            document.getElementById("portada_url").value = url;
        }

        if (hasAudio) {
            status.textContent = "Subiendo audio (puede tardar)...";
            var url = await uploadToCloudinary(audioInput.files[0], "musica", "video", status);
            document.getElementById("audio_url").value = url;
        }

        status.textContent = "Archivos subidos. Guardando...";
        this.submit();
    } catch (err) {
        console.error("[UPLOAD ERROR]", err);
        status.style.display = "none";
        error.style.display = "block";
        error.textContent = "Error al subir: " + err.message;
        btn.disabled = false;
    }
});
</script>

{% endblock %}
